services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: company_knowledge_db

    environment:
      POSTGRES_USER: knowledge_user
      POSTGRES_PASSWORD: knowledge_password
      POSTGRES_DB: company_knowledge

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U knowledge_user -d company_knowledge"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: company_knowledge_agent

    environment:
      # "postgres" is the Compose service hostname.
      DATABASE_URL: postgresql+psycopg://knowledge_user:knowledge_password@postgres:5432/company_knowledge

      EMBEDDING_DIMENSION: "384"

      # Ollama still runs on Windows.
      OLLAMA_URL: http://host.docker.internal:11434/api/generate

      OLLAMA_MODEL: llama3.2:latest

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres_data: